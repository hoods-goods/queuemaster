name: Copy signing secrets to the organization

# One-time helper. GitHub never shows a secret's value again, but a workflow
# in the repo that has the secrets can still pass them to `gh secret set`.
# This copies QueueMaster's Developer ID signing and notarization secrets to
# hoods-goods ORGANIZATION secrets, shared with the repos listed below, so
# every Mac app (PeepingTom, RefurbStation, ...) signs with one set.
#
# Values never appear in the log: they go to gh through stdin, and GitHub
# masks secrets in output anyway.
#
# Needs a temporary repo secret SECRETS_ADMIN_TOKEN: a fine-grained personal
# access token, resource owner hoods-goods, Organization permissions →
# Secrets: Read and write. Delete the token (and this secret) afterwards.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Repos that may use the org secrets (comma-separated)
        required: true
        default: queuemaster,hg-peepingtom,refurb-station-app

permissions:
  contents: read

jobs:
  copy:
    # GitHub-hosted, so the values never touch a machine of ours.
    runs-on: ubuntu-latest
    steps:
    - name: Copy
      env:
        GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        REPOS: ${{ inputs.repos }}
        MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
        MAC_CERTS_P12_2: ${{ secrets.MAC_CERTS_P12_2 }}
        MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        set -uo pipefail
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Add the SECRETS_ADMIN_TOKEN repo secret first (see the comment at the top of this workflow)."; exit 1
        fi
        REPOS=$(echo "$REPOS" | tr -d ' ')
        failed=0
        for NAME in MAC_CERTS_P12 MAC_CERTS_P12_2 MAC_CERTS_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
          VALUE="${!NAME}"
          if [ -z "$VALUE" ]; then echo "::warning::$NAME isn't set in this repo; skipped"; continue; fi
          if printf '%s' "$VALUE" | gh secret set "$NAME" --org hoods-goods --visibility selected --repos "$REPOS" >/dev/null 2>err.txt; then
            echo "Copied $NAME → org secret (repos: $REPOS)"
          else
            echo "::error::$NAME: $(head -c 300 err.txt)"; failed=1
          fi
        done
        rm -f err.txt
        exit $failed
