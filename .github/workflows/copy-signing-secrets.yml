name: Copy signing secrets to other repos

# One-time helper. GitHub never shows a secret's value again, but a workflow
# in the repo that has the secrets can still pass them to `gh secret set`.
# This copies QueueMaster's Developer ID signing and notarization secrets to
# the REPOSITORY secrets of the repos listed below, so other Mac apps
# (PeepingTom, RefurbStation, ...) can sign. (Organization secrets can't be
# used by private repos on the free plan; repository secrets can.)
#
# Values never appear in the log: they go to gh through stdin, and GitHub
# masks secrets in output anyway.
#
# Needs a temporary repo secret SECRETS_ADMIN_TOKEN: a fine-grained personal
# access token, resource owner hoods-goods, access to the target repos only,
# Repository permissions → Secrets: Read and write. Delete the token (and
# this secret) afterwards. Run it again later to copy to another repo.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: Repos to copy the secrets to (comma-separated, hoods-goods)
        required: true
        default: hg-peepingtom

permissions:
  contents: read

jobs:
  copy:
    # GitHub-hosted, so the values never touch a machine of ours.
    runs-on: ubuntu-latest
    steps:
    - name: Copy
      env:
        GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        REPOS: ${{ inputs.repos }}
        MAC_CERTS_P12: ${{ secrets.MAC_CERTS_P12 }}
        MAC_CERTS_P12_2: ${{ secrets.MAC_CERTS_P12_2 }}
        MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
        NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      run: |
        set -uo pipefail
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Add the SECRETS_ADMIN_TOKEN repo secret first (see the comment at the top of this workflow)."; exit 1
        fi
        failed=0
        for REPO in $(echo "$REPOS" | tr ',' ' '); do
          REPO="hoods-goods/${REPO#hoods-goods/}"
          for NAME in MAC_CERTS_P12 MAC_CERTS_P12_2 MAC_CERTS_PASSWORD NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then echo "::warning::$NAME isn't set in this repo; skipped"; continue; fi
            if printf '%s' "$VALUE" | gh secret set "$NAME" --repo "$REPO" >/dev/null 2>err.txt; then
              echo "Copied $NAME → $REPO"
            else
              echo "::error::$NAME → $REPO: $(head -c 300 err.txt)"; failed=1
            fi
          done
        done
        rm -f err.txt
        exit $failed
